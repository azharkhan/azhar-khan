name: CI

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
          cache: npm

      - run: npm ci

      - run: npm run check

  rebuild:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Workers Builds deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CF_DEPLOY_HOOK_URL }}
        run: |
          test -n "$DEPLOY_HOOK_URL" || { echo "CF_DEPLOY_HOOK_URL is not set"; exit 1; }
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK_URL" > /dev/null
